name: Validate TravAI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        script:
          - test:bridge
          - test:agent
          - test:mac
          - test:task-api
          - test:runtime
          - test:recovery
          - test:persistence
          - test:scheduler
          - test:triggers
          - test:diagnostics
          - test:policy
          - test:release
          - test:templates
          - test:favorites
          - test:reliability-controls
          - test:queue-summary
          - test:restored-state
          - test:runtime-approval
          - test:dashboard-recovery
          - test:approval-restore
          - test:release-consistency
          - test:production-certifier
          - test:local-runtime
          - test:runtime-lifecycle
          - test:runtime-identity
          - test:hosting
          - test:portable-release
          - test:release-integrity
          - test:release-attestation
          - test:verify-release
          - test:release-health
          - test:readiness
          - test:self-diagnostics
          - test:runtime-ensure
          - test:cert-history
          - test:cert-identity
          - test:cert-audit
          - test:control-plane
          - test:recovery-center
          - test:release-drift
          - test:pairing-gateway
          - test:pair-local
          - test:pairing-lifecycle
          - test:pairing-dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run component test
        run: npm run "${{ matrix.script }}"
