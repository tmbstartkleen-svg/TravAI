name: Validate TravAI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run full regression suite
        id: tests
        run: npm test
      - name: Publish regression status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.tests.outcome }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$OUTCOME" = "success" ]; then STATE=success; DESC="Full TravAI regression suite passed"; else STATE=failure; DESC="Full TravAI regression suite failed"; fi
          curl -sS -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/statuses/$SHA"             -d "{\"state\":\"$STATE\",\"context\":\"TravAI Regression Suite\",\"description\":\"$DESC\"}"
