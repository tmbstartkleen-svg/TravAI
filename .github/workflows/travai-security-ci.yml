name: TravAI Security Regression
on:
  push:
    branches: [main]
    paths:
      - 'local-bridge/**'
      - 'tests/**'
      - 'agent-safety-v1318.mjs'
      - 'package.json'
      - 'launch-gate-v1400.mjs'
      - '.github/workflows/travai-security-ci.yml'
  pull_request:
    paths:
      - 'launch-gate-v1400.mjs'
      - 'local-bridge/**'
      - 'tests/**'
      - 'agent-safety-v1318.mjs'
      - 'package.json'
      - '.github/workflows/travai-security-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: v14 release certification gate
        shell: bash
        run: |
          set -o pipefail
          npm run launch:check 2>&1 | tee travai-launch-certification.log
      - name: Preserve certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: travai-v14-certification-${{ github.run_id }}
          path: travai-launch-certification.log
          if-no-files-found: warn
          retention-days: 14
