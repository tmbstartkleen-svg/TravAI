name: TravAI Security Regression
on:
  push:
    branches: [main]
    paths:
      - 'local-bridge/**'
      - 'tests/**'
      - 'agent-safety-v1318.mjs'
      - 'package.json'
      - '.github/workflows/travai-security-ci.yml'
  pull_request:
    paths:
      - 'local-bridge/**'
      - 'tests/**'
      - 'agent-safety-v1318.mjs'
      - 'package.json'
      - '.github/workflows/travai-security-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Agent policy regression
        run: npm run test:agent-safety
      - name: Execution receipt regression
        run: npm run test:agent-receipts
      - name: Approval scope and audit regression
        run: npm run test:approval-action
      - name: Full TravAI regression suite
        run: npm test
