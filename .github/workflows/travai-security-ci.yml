name: TravAI Security Regression
on:
  push:
    branches: [main]
    paths:
      - 'local-bridge/**'
      - 'tests/**'
      - 'agent-safety-v1318.mjs'
      - 'package.json'
      - 'launch-gate-v1400.mjs'
      - '.github/workflows/travai-security-ci.yml'
  pull_request:
    paths:
      - 'launch-gate-v1400.mjs'
      - 'local-bridge/**'
      - 'tests/**'
      - 'agent-safety-v1318.mjs'
      - 'package.json'
      - '.github/workflows/travai-security-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: v14 release certification gate
        run: npm run launch:check
